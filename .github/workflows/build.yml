
name: Build ALComplete

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Android32
            target: Android32
          - arch: Android64
            target: Android64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ALComplete
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          sdk: given
          build-config: Release
          android-min-sdk: 23

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ALComplete-${{ matrix.arch }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
